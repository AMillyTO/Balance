<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Champion Balance — Daily Footwork</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --canvas:#141212;
    --canvas2:#1b1817;
    --rope:#f4ede1;
    --rope-dim:#c9c0b0;
    --tape:#e8dfcd;
    --corner-red:#c1392b;
    --corner-red-dim:#7d2a22;
    --gold:#d4a949;
    --line:#332e2b;
    --ok:#7a9e6f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--canvas);
    background-image:
      radial-gradient(ellipse at 50% -10%, #2a2523 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color:var(--rope); font-family:'Oswald',sans-serif; min-height:100vh;}

  .wrap{max-width:520px; margin:0 auto; padding:0 0 60px;}

  /* HEADER — corner-post ring card */
  header{padding:28px 20px 20px; position:relative; border-bottom:1px solid var(--line);}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.18em; color:var(--gold); text-transform:uppercase; display:flex; justify-content:space-between; align-items:center;}
  h1{font-family:'Anton',sans-serif; font-weight:400; font-size:34px; line-height:0.95; letter-spacing:.01em; margin:10px 0 4px; text-transform:uppercase;}
  h1 span{color:var(--corner-red);}
  .sub{font-size:13px; color:var(--rope-dim); font-weight:400;}

  /* MODE TOGGLE */
  .modes{display:flex; gap:8px; padding:16px 20px 0;}
  .mode-btn{flex:1; padding:12px 8px; background:var(--canvas2); border:1px solid var(--line); color:var(--rope-dim);
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; border-radius:2px; cursor:pointer; text-align:center;}
  .mode-btn b{display:block; font-family:'Oswald',sans-serif; font-size:16px; font-weight:600; color:var(--rope); margin-top:2px; letter-spacing:0;}
  .mode-btn.active{border-color:var(--corner-red); background:linear-gradient(180deg, rgba(193,57,43,0.14), rgba(193,57,43,0.04));}
  .mode-btn.active .eyebrow-txt{color:var(--corner-red);}

  /* STREAK BAR */
  .streak{display:flex; align-items:center; justify-content:space-between; margin:16px 20px 0; padding:12px 14px;
    background:var(--canvas2); border:1px solid var(--line); border-radius:2px;}
  .streak-num{font-family:'Anton',sans-serif; font-size:26px; color:var(--gold); line-height:1;}
  .streak-label{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; color:var(--rope-dim); text-transform:uppercase;}
  .streak-days{display:flex; gap:4px;}
  .streak-dot{width:9px; height:9px; border-radius:50%; background:var(--line); border:1px solid var(--line);}
  .streak-dot.hit{background:var(--gold); border-color:var(--gold);}

  /* PROGRESS RAIL */
  .rail-wrap{margin:18px 20px 0;}
  .rail-track{height:3px; background:var(--line); border-radius:2px; overflow:hidden;}
  .rail-fill{height:100%; background:linear-gradient(90deg, var(--corner-red), var(--gold)); width:0%; transition:width .35s ease;}
  .rail-text{display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--rope-dim); margin-top:6px; letter-spacing:.05em;}

  /* RUNGS */
  .rungs{padding:20px 20px 0;}
  .rung{background:var(--canvas2); border:1px solid var(--line); border-radius:3px; margin-bottom:12px; overflow:hidden;}
  .rung.done{border-color:var(--ok);}
  .rung-head{display:flex; align-items:center; gap:12px; padding:14px 14px; cursor:pointer; user-select:none;}
  .rung-num{font-family:'Anton',sans-serif; font-size:22px; color:var(--corner-red-dim); min-width:34px; line-height:1;}
  .rung.done .rung-num{color:var(--ok);}
  .rung-title-block{flex:1;}
  .rung-vol{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--gold); letter-spacing:.1em; text-transform:uppercase;}
  .rung-name{font-size:16px; font-weight:600; margin-top:1px;}
  .rung-time{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--rope-dim); white-space:nowrap;}
  .chevron{width:16px; height:16px; flex-shrink:0; transition:transform .2s ease; opacity:.6;}
  .rung.open .chevron{transform:rotate(180deg);}

  .rung-body{max-height:0; overflow:hidden; transition:max-height .3s ease;}
  .rung.open .rung-body{max-height:600px;}
  .rung-inner{padding:0 14px 14px;}
  .cue{font-size:12.5px; color:var(--rope-dim); font-style:italic; margin-bottom:10px; padding-left:2px; border-left:2px solid var(--corner-red-dim); padding-left:10px;}

  .drill{display:flex; align-items:flex-start; gap:10px; padding:7px 0; border-top:1px solid rgba(255,255,255,0.05);}
  .drill:first-of-type{border-top:none;}
  .checkbox{width:18px; height:18px; border:1.5px solid var(--rope-dim); border-radius:3px; flex-shrink:0; margin-top:1px; cursor:pointer; position:relative;}
  .checkbox.checked{background:var(--ok); border-color:var(--ok);}
  .checkbox.checked::after{content:''; position:absolute; left:5px; top:1px; width:5px; height:9px; border:solid var(--canvas); border-width:0 2px 2px 0; transform:rotate(40deg);}
  .drill-text{font-size:13.5px; line-height:1.4; color:var(--tape);}
  .drill.checked .drill-text{color:var(--rope-dim); text-decoration:line-through; text-decoration-color:var(--line);}

  .mark-done{width:100%; margin-top:12px; padding:11px; background:transparent; border:1px solid var(--ok); color:var(--ok);
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; border-radius:2px; cursor:pointer;}
  .mark-done.is-done{background:var(--ok); color:var(--canvas);}

  footer{padding:24px 20px 0; text-align:center;}
  .reset-btn{background:none; border:none; color:var(--line); font-family:'JetBrains Mono',monospace; font-size:11px; text-decoration:underline; cursor:pointer; padding:10px;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--gold); color:var(--canvas);
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.05em; padding:10px 18px; border-radius:3px; opacity:0; transition:all .3s ease; pointer-events:none; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow"><span>SECRETS OF A CHAMPION BALANCE</span><span>T. WITTMAN</span></div>
    <h1>DAILY<br><span>FOOTWORK</span></h1>
    <div class="sub">8 rungs · 31 drills · your own progression card</div>
  </header>

  <div class="modes">
    <div class="mode-btn active" id="modeFull" onclick="setMode('full')">
      <span class="eyebrow-txt">FULL RUN</span><b>~28 min</b>
    </div>
    <div class="mode-btn" id="modeDaily" onclick="setMode('daily')">
      <span class="eyebrow-txt">DAILY</span><b>~15 min</b>
    </div>
  </div>

  <div class="streak">
    <div>
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">day streak</div>
    </div>
    <div class="streak-days" id="streakDays"></div>
  </div>

  <div class="rail-wrap">
    <div class="rail-track"><div class="rail-fill" id="railFill"></div></div>
    <div class="rail-text"><span id="railText">0 of 9 rungs done</span><span id="railTime">~28 min today</span></div>
  </div>

  <div class="rungs" id="rungs"></div>

  <footer>
    <button class="reset-btn" onclick="resetToday()">reset today's session</button>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const DATA = [
  { vol:"VOL 1 · STANCE", name:"Base Movement", time:"3 min", dailyTime:"2 min",
    cue:"Toe-to-heel steps, keep it quiet. No punches yet.",
    drills:[
      {t:"1-2, cross-over step so you're never in the same spot", full:true, daily:true},
      {t:"1-2-3, step left off the line", full:true, daily:true},
    ]},
  { vol:"VOL 2 · WALKING WITH PUNCHES", name:"Directional Combos", time:"5 min", dailyTime:"3 min",
    cue:"\"Low ceiling\" — stay under it the whole time, knees bent.",
    drills:[
      {t:"1-2 stepping forward", full:true, daily:true},
      {t:"1-2 stepping backward", full:true, daily:true},
      {t:"1-2 stepping laterally right", full:true, daily:false},
      {t:"1-2 stepping laterally left", full:true, daily:false},
      {t:"2-3 stepping laterally right", full:true, daily:false},
      {t:"2-3 stepping laterally left", full:true, daily:false},
      {t:"Jab stepping backward-right (the hard one)", full:true, daily:true},
    ]},
  { vol:"VOL 2 · COUNTER BALANCE HIPS", name:"Hip-Driven Slip", time:"4 min", dailyTime:"2 min",
    cue:"It's not head movement — it's hip movement. Head follows.",
    drills:[
      {t:"Hips left to right, no hands", full:true, daily:true},
      {t:"Hips front to back, no hands", full:true, daily:false},
      {t:"Hips moving head around speed bag", full:true, daily:true},
      {t:"1-2 → matched to 2 hip motions", full:true, daily:true},
      {t:"3-2-3 → matched to 3 hip motions", full:true, daily:false},
    ]},
  { vol:"VOL 3 · SLIP ROPE", name:"Take Your Feet With You", time:"3 min", dailyTime:"2 min",
    cue:"Foot rule: lead foot moves forward, rear foot moves laterally.",
    drills:[
      {t:"Rope + 1-2-3, stepping left", full:true, daily:true},
      {t:"Rope + 1-2, stepping right", full:true, daily:true},
    ]},
  { vol:"VOL 4 · BASE STEPS", name:"Drop & Rise", time:"3 min", dailyTime:"2 min",
    cue:"Shoulders level = balanced. Self-check constantly.",
    drills:[
      {t:"Narrow stance, drop your base", full:true, daily:true},
      {t:"Drop → rise → lead uppercut or lead hook", full:true, daily:true},
    ]},
  { vol:"VOL 4 · SPRINT STEPS", name:"Explosive Base", time:"3 min", dailyTime:"2 min",
    cue:"Cover ground fast, land balanced — not just drop in place.",
    drills:[
      {t:"Sprint step + drop base, forward", full:true, daily:true},
      {t:"Sprint step + drop base, backward", full:true, daily:false},
      {t:"Sprint step + drop base, right", full:true, daily:true},
      {t:"Sprint step + drop base, left", full:true, daily:false},
      {t:"Double-up sprint steps, multiple directions", full:true, daily:false},
    ]},
  { vol:"VOL 4 · RESET STEPS", name:"Pendulum, L-Step, Pimp Step", time:"4 min", dailyTime:"2 min",
    cue:"Same rebound mechanic each time — deception layers on top.",
    drills:[
      {t:"Retreat: pendulum step back, rebound forward + punch", full:true, daily:true},
      {t:"L-step: rebound back, step right", full:true, daily:true},
      {t:"Pimp step: fake right, rebound left", full:true, daily:false},
    ]},
  { vol:"VOL 4 · OFF-BALANCING", name:"Commit & Ride It", time:"3 min", dailyTime:"—",
    cue:"Everything before this had to be solid, or you just fall over.",
    drills:[
      {t:"Full commit right hand, move right, stay on target", full:true, daily:false},
      {t:"Full commit left hook, move left, stay on target", full:true, daily:false},
    ]},
];

const TOTAL_MIN_FULL = 28;
const TOTAL_MIN_DAILY = 15;

let mode = 'full';
let state = null;

async function loadState(){
  try{
    const res = await window.storage.get('footwork-state');
    state = JSON.parse(res.value);
  }catch(e){
    state = { checks:{}, streakDates:[], lastSessionDate:null };
  }
}

async function saveState(){
  try{ await window.storage.set('footwork-state', JSON.stringify(state)); }catch(e){}
}

function todayStr(){ return new Date().toISOString().slice(0,10); }

function setMode(m){
  mode = m;
  document.getElementById('modeFull').classList.toggle('active', m==='full');
  document.getElementById('modeDaily').classList.toggle('active', m==='daily');
  render();
}

function toggleDrill(ri, di){
  const key = mode+'-'+ri+'-'+di;
  state.checks[key] = !state.checks[key];
  saveState();
  render();
}

function toggleRung(ri){
  const el = document.getElementById('rung-'+ri);
  el.classList.toggle('open');
}

async function markDone(ri){
  const key = mode+'-rungdone-'+ri;
  state.checks[key] = !state.checks[key];
  await saveState();
  checkStreak();
  render();
}

function rungIsDone(ri){
  return !!state.checks[mode+'-rungdone-'+ri];
}

function activeDrills(rung){
  return rung.drills.filter(d => mode==='daily' ? d.daily : d.full);
}

async function checkStreak(){
  const doneCount = DATA.filter((_,ri)=>rungIsDone(ri)).length;
  const today = todayStr();
  if(doneCount >= Math.ceil(DATA.length*0.6) && !state.streakDates.includes(today)){
    state.streakDates.push(today);
    state.streakDates.sort();
    await saveState();
    showToast('Logged — nice work 👊');
  }
}

function computeStreak(){
  if(!state.streakDates.length) return 0;
  const dates = state.streakDates.slice().sort();
  let streak = 1;
  let cursor = new Date(dates[dates.length-1]);
  for(let i=dates.length-2;i>=0;i--){
    const prev = new Date(dates[i]);
    const diff = (cursor - prev)/86400000;
    if(diff === 1){ streak++; cursor = prev; } else break;
  }
  // check streak is still "live" (today or yesterday)
  const last = new Date(dates[dates.length-1]);
  const diffFromToday = (new Date(todayStr()) - last)/86400000;
  if(diffFromToday > 1) return 0;
  return streak;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function resetToday(){
  Object.keys(state.checks).forEach(k=>{
    if(k.startsWith(mode+'-')) delete state.checks[k];
  });
  await saveState();
  render();
}

function render(){
  // streak
  const streak = computeStreak();
  document.getElementById('streakNum').textContent = streak;
  const dotsEl = document.getElementById('streakDays');
  dotsEl.innerHTML = '';
  const last7 = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    last7.push(d.toISOString().slice(0,10));
  }
  last7.forEach(d=>{
    const dot = document.createElement('div');
    dot.className = 'streak-dot' + (state.streakDates.includes(d) ? ' hit' : '');
    dotsEl.appendChild(dot);
  });

  // rungs
  const rungsEl = document.getElementById('rungs');
  rungsEl.innerHTML = '';
  let doneRungs = 0;

  DATA.forEach((rung, ri)=>{
    const drills = activeDrills(rung);
    if(drills.length === 0) return; // skip rungs with nothing in this mode

    const done = rungIsDone(ri);
    if(done) doneRungs++;

    const rungEl = document.createElement('div');
    rungEl.className = 'rung' + (done ? ' done':'');
    rungEl.id = 'rung-'+ri;

    const timeShown = mode==='daily' ? rung.dailyTime : rung.time;

    rungEl.innerHTML = `
      <div class="rung-head" onclick="toggleRung(${ri})">
        <div class="rung-num">${String(ri+1).padStart(2,'0')}</div>
        <div class="rung-title-block">
          <div class="rung-vol">${rung.vol}</div>
          <div class="rung-name">${rung.name}</div>
        </div>
        <div class="rung-time">${timeShown}</div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="rung-body">
        <div class="rung-inner">
          <div class="cue">${rung.cue}</div>
          ${drills.map((d,di)=>{
            const origIdx = rung.drills.indexOf(d);
            const checked = !!state.checks[mode+'-'+ri+'-'+origIdx];
            return `<div class="drill${checked?' checked':''}">
              <div class="checkbox${checked?' checked':''}" onclick="toggleDrill(${ri},${origIdx})"></div>
              <div class="drill-text">${d.t}</div>
            </div>`;
          }).join('')}
          <button class="mark-done${done?' is-done':''}" onclick="markDone(${ri})">${done ? '✓ Rung Complete' : 'Mark Rung Done'}</button>
        </div>
      </div>
    `;
    rungsEl.appendChild(rungEl);
  });

  const totalRungsShown = DATA.filter(r => activeDrills(r).length > 0).length;
  document.getElementById('railFill').style.width = (doneRungs/totalRungsShown*100)+'%';
  document.getElementById('railText').textContent = `${doneRungs} of ${totalRungsShown} rungs done`;
  document.getElementById('railTime').textContent = mode==='daily' ? `~${TOTAL_MIN_DAILY} min today` : `~${TOTAL_MIN_FULL} min today`;
}

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
